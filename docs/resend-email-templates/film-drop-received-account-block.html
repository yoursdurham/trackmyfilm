<!--
  Paste this into the published Resend template film_drop_received.
  Do not upload this file. The app only sends the account_url variable.

  Where: inside the main card, after the Track / F.A.Q. / Shop button row
  and before the cream box that starts with "Yours, Durham".
  This fragment is one table row. Paste it as the next <tr> in that card.

  Variable: {{{account_url}}}
  Same triple-brace syntax as {{{tracking_url}}} in this template.
  Add account_url as a string variable before you publish. Fallback:
  https://trackmyfilm.com/account/login
  A missing value then still opens sign-in, without a prefilled address.

  Clients that drop CSS gradients get the solid #F3E4D0 background.
  Text is #1a1a1a on that fill, and on the pink and green gradient stops.

  Plain-text version, after the Shop line and before "Yours, Durham":

  YOUR FILM, ALL TOGETHER
  Keep track of every roll
  Create a free Track My Film account to see all your orders and the film stocks you've shot in one place.
  Create your account: {{{account_url}}}
-->
<tr>
  <td class="px" lang="en" dir="ltr" align="left" style="padding:8px 22px 8px;font-family:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,'Courier New',monospace;color:#1a1a1a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate;">
      <tr>
        <td lang="en" dir="ltr" align="left" bgcolor="#F3E4D0" style="background-color:#F3E4D0;background-image:linear-gradient(128deg,#DDB1B1 0%,#F4E4C4 48%,#A1CC93 100%);border:2px solid #1a1a1a;border-radius:12px;padding:28px 24px;font-family:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,'Courier New',monospace;color:#1a1a1a;">
          <p style="margin:0;padding:0;font-family:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,'Courier New',monospace;font-size:12px;line-height:1.4;font-weight:700;letter-spacing:0.08em;color:#1a1a1a;">YOUR FILM, ALL TOGETHER</p>
          <h2 style="margin:10px 0 12px;padding:0;font-family:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,'Courier New',monospace;font-size:26px;line-height:1.25;font-weight:800;color:#1a1a1a;">Keep track of every roll</h2>
          <p style="margin:0;padding:0;font-family:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,'Courier New',monospace;font-size:15px;line-height:1.5;font-weight:400;color:#1a1a1a;">Create a free Track My Film account to see all your orders and the film stocks you've shot in one place.</p>
          <table role="presentation" cellpadding="0" cellspacing="0" border="0">
            <tr>
              <td height="18" style="height:18px;font-size:0;line-height:0;mso-line-height-rule:exactly;">&nbsp;</td>
            </tr>
            <tr>
              <td align="center" bgcolor="#FFF6D3" style="background-color:#FFF6D3;border:1.5px solid #1a1a1a;border-radius:4px;mso-padding-alt:12px 16px;">
                <a href="{{{account_url}}}" target="_blank" rel="noopener noreferrer" style="display:inline-block;padding:12px 16px;font-family:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,'Courier New',monospace;font-size:15px;line-height:1.3;font-weight:700;color:#1a1a1a;text-align:center;text-decoration:none;mso-line-height-rule:exactly;">Create your account →</a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </td>
</tr>
